spring.application.name=fersal

# ==================================
# ALMACENAMIENTO DE IMAGENES
# ==================================
app.upload.dir=uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ==================================
# CONEXION MYSQL
# ==================================
spring.datasource.url=jdbc:mysql://162.220.10.11:3306/dosisma_fersal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=dosisma_fersal
spring.datasource.password=5709765Afc


# ==================================
# JPA / HIBERNATE
# ==================================

# IMPORTANTE:
# No usar create cuando ya tienes datos
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ==================================
# HIKARI CONNECTION POOL
# ==================================

spring.datasource.hikari.connection-timeout=30000

spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.minimum-idle=2

# Tiempo que una conexión puede estar inactiva
spring.datasource.hikari.idle-timeout=300000

# Renovar conexión cada 30 minutos
spring.datasource.hikari.max-lifetime=1800000

# Mantener conexiones vivas cada 5 minutos
spring.datasource.hikari.keepalive-time=300000


# ==================================
# SERVER
# ==================================

server.address=0.0.0.0
server.port=8080